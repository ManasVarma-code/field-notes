<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <pattern id="dotPattern" x="0" y="0" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#2c2a29" fill-opacity="0.12" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#f7f5f0" />
  <rect width="1200" height="630" fill="url(#dotPattern)" />

  <!-- Outer Editorial Borders -->
  <rect x="40" y="40" width="1120" height="550" fill="none" stroke="#2c2a29" stroke-width="2" />
  <rect x="48" y="48" width="1104" height="534" fill="none" stroke="#2c2a29" stroke-width="0.75" stroke-opacity="0.4" />

  <!-- Header line -->
  <line x1="40" y1="110" x2="1160" y2="110" stroke="#2c2a29" stroke-width="1.5" />

  <!-- Top bar info -->
  <g transform="translate(65, 82)">
    <!-- Monogram -->
    <rect x="0" y="-18" width="28" height="28" fill="none" stroke="#2c2a29" stroke-width="1.5" />
    <text x="5" y="4" font-family="Georgia, serif" font-size="18" font-weight="bold" fill="#2c2a29">B</text>
    <path d="M19 -8 L23 -12 M20 -12 L23 -12 L23 -9" stroke="#d13b28" stroke-width="1.5" fill="none" />
    
    <text x="38" y="2" font-family="'IBM Plex Sans', -apple-system, sans-serif" font-size="18" font-weight="600" fill="#2c2a29" letter-spacing="0.5">BeenHere</text>
    <text x="145" y="2" font-family="'IBM Plex Mono', monospace" font-size="12" fill="#756f6a">/ FIELD GUIDE 001 · OPEN SOURCE AGENT SKILL</text>
  </g>

  <!-- Top Right Status -->
  <g transform="translate(980, 82)">
    <rect x="-10" y="-14" width="150" height="22" fill="#d13b28" fill-opacity="0.1" stroke="#d13b28" stroke-width="1" />
    <text x="65" y="1" font-family="'IBM Plex Mono', monospace" font-size="11" font-weight="bold" fill="#d13b28" text-anchor="middle">v1.0.0-beta.1</text>
  </g>

  <!-- Main Headline -->
  <g transform="translate(80, 210)">
    <text x="0" y="0" font-family="'DM Serif Display', Georgia, serif" font-size="58" fill="#2c2a29">Before you build it,</text>
    <text x="0" y="70" font-family="'DM Serif Display', Georgia, serif" font-size="58" fill="#2c2a29">see who's <tspan fill="#d13b28" font-style="italic">been here.</tspan></text>
  </g>

  <!-- Tagline / Subhead -->
  <g transform="translate(80, 340)">
    <text x="0" y="0" font-family="'IBM Plex Sans', -apple-system, sans-serif" font-size="22" fill="#4a4441" max-width="900">
      Someone solved part of this already. Find it before you write code.
    </text>
    <text x="0" y="34" font-family="'IBM Plex Sans', -apple-system, sans-serif" font-size="16" fill="#756f6a">
      Investigates existing products, reusable repositories, academic approaches, and licensing risks.
    </text>
  </g>

  <!-- Terminal Command Box -->
  <g transform="translate(80, 420)">
    <rect x="0" y="0" width="620" height="64" fill="#ffffff" stroke="#2c2a29" stroke-width="1.5" />
    <text x="24" y="38" font-family="'IBM Plex Mono', monospace" font-size="16" font-weight="bold" fill="#d13b28">$</text>
    <text x="44" y="38" font-family="'IBM Plex Mono', monospace" font-size="16" fill="#2c2a29">npx skills add manasvignesh/BeenHere</text>
  </g>

  <!-- Workflow Badges on the right -->
  <g transform="translate(740, 420)">
    <rect x="0" y="0" width="380" height="64" fill="#f0ece1" stroke="#2c2a29" stroke-width="1" />
    <text x="20" y="26" font-family="'IBM Plex Mono', monospace" font-size="11" fill="#756f6a">VERIFIED RUNTIME</text>
    <text x="20" y="48" font-family="'IBM Plex Sans', sans-serif" font-size="14" font-weight="600" fill="#2c2a29">OpenAI Codex &amp; Claude Code</text>
  </g>

  <!-- Bottom Folio Bar -->
  <line x1="40" y1="520" x2="1160" y2="520" stroke="#2c2a29" stroke-width="1" stroke-opacity="0.3" />
  <g transform="translate(80, 555)">
    <text x="0" y="0" font-family="'IBM Plex Mono', monospace" font-size="12" fill="#756f6a">github.com/manasvignesh/BeenHere · MIT License · Zero 3P Dependencies</text>
    <text x="960" y="0" font-family="'IBM Plex Mono', monospace" font-size="12" fill="#d13b28" text-anchor="end">FOLIO 01 / DOSSIER</text>
  </g>
</svg>
